id: s2-env-secrets
title: Developer pastes a .env file with an AWS key
description: The AWS access key and secret key are redacted before the prompt reaches the external model; the rest of the question goes through.
principal: dev-assistant
model: gpt-4o-mini
tools: [web.fetch, code.run_python]
user: |
  Deploy to staging fails with AccessDenied. This is the .env from the pipeline:

  AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
  AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  AWS_REGION=eu-central-1
  APP_ENV=staging

  What is wrong?
responses:
  - content: >-
      AccessDenied usually means the IAM user behind these credentials lacks the required
      permission for the deploy role, or the key was deactivated. Check the policy attached to
      the deploy user. Since the key was pasted into a chat tool, rotate it per KB-006.
expect:
  outcome: completed
  stop_step: 1
  steps:
    - {step: 1, action: redact, findings: ["secrets.aws-access-key-id"]}
  upstream_must_not_contain:
    - AKIAIOSFODNN7EXAMPLE
    - wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
