id: s5-team-budget
title: Interns team runs out of its daily budget
description: The interns team has the tightest budget; heavy calls exhaust its tokens-per-minute allowance and the next call is blocked with HTTP 429.
principal: intern-bot
model: gpt-4o-mini
tools: [kb.search]
user: Prepare a one-page summary of all fees, limits and KYC rules for new joiners.
# The limit that bites first is interns.tokens_per_minute (5000). Each scripted response reports a
# large token count, so the allowance is spent after one call and the next call is blocked.
# (The USD downgrade path is covered by tests/cases/budgets.yaml and can be shown in the Playground.)
responses:
  - tool_calls: [{name: kb__search, arguments: {query: fees}}]
    usage: {prompt_tokens: 4000, completion_tokens: 1000}
  - tool_calls: [{name: kb__search, arguments: {query: transfer limits}}]
    usage: {prompt_tokens: 4000, completion_tokens: 1000}
  - tool_calls: [{name: kb__search, arguments: {query: kyc procedure}}]
    usage: {prompt_tokens: 4000, completion_tokens: 1000}
  - content: Summary of fees, limits and KYC rules for new joiners.
    usage: {prompt_tokens: 4000, completion_tokens: 1000}
expect:
  outcome: blocked
  code: ["budgets.*"]
  stop_step: [1, 2, 3]
  steps:
    - {step: 1, action: allow}
