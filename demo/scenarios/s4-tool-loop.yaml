id: s4-tool-loop
title: Agent stuck in a tool-call loop
description: The model repeats the same kb.search call with the same arguments; the loop breaker blocks it after the configured number of identical calls (max_identical_tool_calls, 3 by default).
principal: ops-copilot
model: gpt-4o-mini
tools: [crm.lookup_customer, kb.search, web.fetch, mail.send, payments.create_transfer]
user: What is the daily transfer limit for a retail customer?
responses:
  - tool_calls: [{name: kb__search, arguments: {query: daily transfer limit}}]
  - tool_calls: [{name: kb__search, arguments: {query: daily transfer limit}}]
  - tool_calls: [{name: kb__search, arguments: {query: daily transfer limit}}]
  - tool_calls: [{name: kb__search, arguments: {query: daily transfer limit}}]
  - tool_calls: [{name: kb__search, arguments: {query: daily transfer limit}}]
  - content: The default daily limit for mobile and web transfers is 20,000 PLN.
expect:
  outcome: blocked
  code: ["loops.*"]
  stop_step: [3, 4]
  steps:
    - {step: 1, action: allow}
    - {step: 2, action: allow}
