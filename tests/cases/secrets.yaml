# Secrets detection and redaction (OWASP LLM02, Agentic ASI03).
# Redacted values are replaced with [REDACTED:<rule>] before the request reaches the model.
# All keys below are documentation examples or random strings; none of them is a real credential.

- id: secrets-redact-aws-key
  control: secrets
  kind: redact
  owasp_llm: [LLM02]
  principal: dev-assistant
  request:
    model: gpt-4o-mini
    messages: [{role: user, content: "Deploy fails, config: AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE"}]
  expect:
    action: redact
    findings: [secrets.aws-access-key-id]
    upstream_must_not_contain: ["AKIAIOSFODNN7EXAMPLE"]
    upstream_must_contain: ["[REDACTED:aws-access-key-id]"]

- id: secrets-redact-aws-key-and-secret-env-file
  control: secrets
  kind: redact
  owasp_llm: [LLM02]
  principal: dev-assistant
  request:
    model: gpt-4o-mini
    messages:
      - role: user
        content: "Why does boto3 fail?\nAWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\nAWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\nAWS_REGION=eu-central-1"
  expect:
    action: redact
    findings: [secrets.aws-access-key-id, secrets.aws-secret-access-key]
    upstream_must_not_contain: ["AKIAIOSFODNN7EXAMPLE", "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"]
    upstream_must_contain: ["AWS_REGION=eu-central-1"]

