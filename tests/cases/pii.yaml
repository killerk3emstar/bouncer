# PII detection with checksum validation (OWASP LLM02).
# All personal data below is fictional; PESEL, NIP, IBAN and card numbers are well-known test values.

- id: pii-redact-email
  control: pii
  kind: redact
  owasp_llm: [LLM02]
  principal: dev-assistant
  request: {model: gpt-4o-mini, messages: [{role: user, content: "Draft a reply to jan.kowalski@mailbox.example about the delayed statement."}]}
  expect:
    action: redact
    findings: [pii.EMAIL]
    upstream_must_not_contain: ["jan.kowalski@mailbox.example"]
    upstream_must_contain: ["[REDACTED:EMAIL]"]

