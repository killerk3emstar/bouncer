# Tool governance: allowlists, argument limits, lethal trifecta, goal alignment (OWASP LLM06, Agentic ASI02).
# The model's tool calls come from the simulated upstream (mock_response); Bouncer checks them before
# they reach the agent. The fake judge is scripted per case so these tests isolate the deterministic rules.

- id: tools-block-tool-outside-allowlist
  control: tool_governance
  kind: block
  owasp_llm: [LLM06]
  principal: intern-bot
  request: {model: "qwen3:8b", messages: [{role: user, content: "Tell the team that the onboarding doc moved."}]}
  mock_response: {tool_calls: [{name: mail__send, arguments: {to: "team@bank.example", subject: "Doc moved", body: "See the wiki."}}]}
  expect: {action: block, status: 403, findings: [tool_governance.unknown_tool], response_must_not_contain: ["team@bank.example"]}

