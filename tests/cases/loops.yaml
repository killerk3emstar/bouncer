# Loops and runaway agents (OWASP LLM10, Agentic ASI08). max_identical_tool_calls: 3 means the 4th
# identical call inside the window is blocked and the session is paused for the cooldown.

- id: loops-block-fourth-identical-call
  control: loops
  kind: block
  owasp_llm: [LLM10]
  owasp_agentic: [ASI08]
  principal: ops-copilot
  steps:
    - request: {model: gpt-4o-mini, messages: [{role: user, content: "Find the KB article about fees."}]}
      mock_response: {tool_calls: [{name: kb__search, arguments: {query: "fees"}}]}
      expect: {action: allow}
    - request: {model: gpt-4o-mini, messages: [{role: user, content: "Find the KB article about fees."}]}
      mock_response: {tool_calls: [{name: kb__search, arguments: {query: "fees"}}]}
      expect: {action: allow}
    - request: {model: gpt-4o-mini, messages: [{role: user, content: "Find the KB article about fees."}]}
      mock_response: {tool_calls: [{name: kb__search, arguments: {query: "fees"}}]}
      expect: {action: allow}
    - request: {model: gpt-4o-mini, messages: [{role: user, content: "Find the KB article about fees."}]}
      mock_response: {tool_calls: [{name: kb__search, arguments: {query: "fees"}}]}
      expect: {action: block, findings: [loops.identical_tool_calls]}
    - request: {model: gpt-4o-mini, messages: [{role: user, content: "Try something else then."}]}
      expect: {action: block, status: 429, findings: [loops.circuit_breaker_open], upstream_called: false}

- id: loops-block-identical-calls-in-history
  control: loops
  kind: block
  owasp_llm: [LLM10]
  principal: ops-copilot
  request:
    model: gpt-4o-mini
    messages:
      - {role: user, content: "Find the KB article about fees."}
      - {role: assistant, content: null, tool_calls: [{id: a1, type: function, function: {name: kb__search, arguments: "{\"query\": \"fees\"}"}}]}
      - {role: tool, tool_call_id: a1, content: "No results."}
      - {role: assistant, content: null, tool_calls: [{id: a2, type: function, function: {name: kb__search, arguments: "{\"query\": \"fees\"}"}}]}
      - {role: tool, tool_call_id: a2, content: "No results."}
      - {role: assistant, content: null, tool_calls: [{id: a3, type: function, function: {name: kb__search, arguments: "{\"query\": \"fees\"}"}}]}
      - {role: tool, tool_call_id: a3, content: "No results."}
  mock_response: {tool_calls: [{name: kb__search, arguments: {query: "fees"}}]}
  expect: {action: block, findings: [loops.identical_tool_calls]}

- id: loops-block-max-steps
  control: loops
  kind: block
  owasp_llm: [LLM10]
  principal: ops-copilot
  policy_patch: {budgets: {sessions: {max_steps: 2}}}
  request:
    model: gpt-4o-mini
    messages:
      - {role: user, content: "Find the KB article about fees."}
      - {role: assistant, content: null, tool_calls: [{id: a1, type: function, function: {name: kb__search, arguments: "{\"query\": \"fees\"}"}}]}
      - {role: tool, tool_call_id: a1, content: "No results."}
      - {role: assistant, content: null, tool_calls: [{id: a2, type: function, function: {name: kb__search, arguments: "{\"query\": \"card fees\"}"}}]}
      - {role: tool, tool_call_id: a2, content: "No results."}
  expect: {action: block, findings: [loops.max_steps], upstream_called: false}

- id: loops-allow-different-arguments
  control: loops
  kind: allow
  owasp_llm: [LLM10]
  principal: ops-copilot
  request:
    model: gpt-4o-mini
    messages:
      - {role: user, content: "Find the KB articles about fees, limits and cards."}
      - {role: assistant, content: null, tool_calls: [{id: a1, type: function, function: {name: kb__search, arguments: "{\"query\": \"fees\"}"}}]}
      - {role: tool, tool_call_id: a1, content: "Fees article."}
      - {role: assistant, content: null, tool_calls: [{id: a2, type: function, function: {name: kb__search, arguments: "{\"query\": \"limits\"}"}}]}
      - {role: tool, tool_call_id: a2, content: "Limits article."}
      - {role: assistant, content: null, tool_calls: [{id: a3, type: function, function: {name: kb__search, arguments: "{\"query\": \"cards\"}"}}]}
      - {role: tool, tool_call_id: a3, content: "Cards article."}
  mock_response: {tool_calls: [{name: kb__search, arguments: {query: "card replacement"}}]}
  expect: {action: allow}

