[project]
name = "bouncer"
version = "0.1.0"
description = "AI control layer: one checkpoint between agents and the models, MCP tools and other agents they call."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "watchfiles>=0.22",
    "prometheus-client>=0.20",
    "pynacl>=1.5",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "fastmcp>=2.10",
    "openai>=1.40",
    "faker>=25.0",
    # Judge backend on Apple Silicon only; Linux containers use the ollama-guard backend.
    "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "redis>=5",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "pytest>=8.2",
    "pytest-html>=4.1",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit1"
addopts = "-q --timeout=60 --import-mode=importlib"
markers = [
    "live: needs the running stack, real models and network (make test-live)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
